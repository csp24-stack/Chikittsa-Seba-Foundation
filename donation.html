<h2 data-en="How to donate" data-bn="কীভাবে দান করবেন"></h2><p class="note" data-en="Online payment is not connected yet. Send your donation to the number below, then record your pledge here with the transaction ID. Our team confirms each pledge only after checking the transfer." data-bn="অনলাইন পেমেন্ট এখনও সংযুক্ত হয়নি। নিচের নম্বরে আপনার দান পাঠিয়ে ট্রান্সেকশন আইডিসহ এখানে অঙ্গীকার জমা দিন। টাকা এসেছে মিলিয়ে দেখার পরই আমাদের দল তা নিশ্চিত করবে।"></p><br><div class="pay"><div><small data-en="bKash / Nagad" data-bn="বিকাশ / নগদ"></small><b>01850692597</b></div><button type="button" id="paycp" data-en="Copy number" data-bn="নম্বর কপি করুন"></button></div><ul class="ck"><li data-en="Medical assistance" data-bn="চিকিৎসা সহায়তা"></li><li data-en="Mother and child healthcare" data-bn="মা ও শিশু স্বাস্থ্যসেবা"></li><li data-en="Emergency medical assistance" data-bn="জরুরি চিকিৎসা সহায়তা"></li></ul><a class="btn alt back" href="index.html" data-en="← Back to Home" data-bn="← হোমে ফিরুন"></a>
 </aside>

 <form data-table="donations" data-ok="Thank you. Your pledge is recorded and will be verified." data-ok-bn="ধন্যবাদ। আপনার অঙ্গীকার সংরক্ষিত হয়েছে, যাচাই করা হবে।">
