@media(prefers-color-scheme:dark){:root{--bg:#0f1a20;--ink:#e6eef2;--mute:#9db0ba;--line:#26373f;--mint:#12251c;--blue-l:#12232f;--green:#4cc38a;--green-d:#3aa874;--blue:#6db3ee}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;font:17px/1.65 "Hind Siliguri",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
#banner{display:none;background:#b42318;color:#fff;text-align:center;padding:8px 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;color:var(--green);text-decoration:none;display:flex;gap:10px;align-items:center}
.brand i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px;line-height:1}
nav{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}nav a{color:var(--ink);text-decoration:none;font-size:16px;font-weight:700}nav a:hover{color:var(--green)}
button,.btn{font:inherit;cursor:pointer;border-radius:var(--r);border:2px solid var(--green);background:var(--green);color:#fff;padding:10px 20px;text-decoration:none;display:inline-block;font-weight:500}
.btn.alt,button.alt{background:transparent;color:var(--green)}.btn.light{background:#fff;color:var(--green-d);border-color:#fff}.btn.ghost{background:transparent;color:#fff;border-color:#fff}
#lang{padding:4px 12px;background:transparent;color:var(--blue);border-color:var(--blue)}
.hero{background:linear-gradient(120deg,rgba(20,87,58,.93),rgba(28,93,153,.88)),url("assets/hero.jpg") center/cover #14573a;color:#fff;padding:90px 0 80px}
.hero h1{font-size:clamp(32px,5.5vw,56px);line-height:1.2;margin:0 0 16px;max-width:15em}.hero p{max-width:36em;font-size:19px;margin:0 0 28px;opacity:.95}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
section{padding:64px 0}section.tint{background:var(--mint)}section.blue{background:var(--blue-l)}
h2{font-size:30px;margin:0 0 8px;line-height:1.25}.sub{color:var(--mute);margin:0 0 32px;max-width:40em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:-40px;background:var(--bg);position:relative}
.stats div{padding:24px;border-right:1px solid var(--line)}.stats b{display:block;font-size:34px;color:var(--green);line-height:1.1}.stats span{color:var(--mute);font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.mv{padding:24px;border-left:5px solid var(--green);background:var(--mint)}.mv.b{border-color:var(--blue);background:var(--blue-l)}.mv h3{margin:0 0 6px}
.progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border-top:1px solid var(--line)}
.progs li{list-style:none;padding:16px 4px;border-bottom:1px solid var(--line);font-weight:500}.progs{padding:0;margin:0}
.progs li small{display:block;color:var(--mute);font-weight:400;font-size:14px}
form{display:grid;gap:14px;max-width:640px}label{display:grid;gap:4px;font-weight:500;font-size:15px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}.chk input{width:auto;margin-top:6px}
.hp{position:absolute;left:-9999px}
.msg{padding:12px 14px;border-radius:8px;display:none}.msg.ok{display:block;background:var(--mint);color:var(--green-d)}.msg.err{display:block;background:#fdecea;color:#8a1c12}
.note{background:var(--blue-l);padding:16px;border-radius:var(--r);max-width:640px}
footer{background:#10241c;color:#cfe3d9;padding:40px 0;font-size:15px}footer a{color:#9fd4ff}
#wa{position:fixed;right:16px;bottom:16px;z-index:6;display:none;background:#25d366;border-color:#25d366;border-radius:50px}
@media(max-width:700px){.bar{padding-bottom:8px}nav{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding-bottom:4px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

[hidden]{display:none!important}body.adm #site{display:none}
#adminView h1{font-size:24px;margin:0;color:var(--green)}
#login{max-width:380px;margin:12vh auto;padding:0 20px;display:grid;gap:12px}
#lmsg{background:#fdecea;color:#8a1c12}
#adminView .ahead{border-bottom:1px solid var(--line)}#adminView .bar .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0}.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.tabs b{background:#d92d20;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}.tw table{border-collapse:collapse;width:100%;font-size:15px}
.tw th,.tw td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tw th{background:var(--mint);white-space:nowrap}.tw tr:last-child td{border-bottom:0}
.tw details summary{cursor:pointer;color:var(--blue);font-weight:500}.tw details dl{margin:8px 0 0;font-size:14px;color:var(--mute);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;max-width:520px}.tw details dt{font-weight:500}.tw details dd{margin:0;word-break:break-word}
.st-pending{border-color:#f79009}.st-approved,.st-verified,.st-fulfilled{border-color:var(--green)}.st-rejected,.st-failed{border-color:#d92d20}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:20px;display:none;z-index:9}
.empty{padding:30px;color:var(--mute)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{background:transparent;color:var(--ink);border-color:var(--line);padding:6px 14px}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.gal figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gal img,.gal video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--mint)}.gal figcaption{padding:10px 12px;font-size:14px;color:var(--mute)}

<section id="about"><div class="wrap">
 <h2 data-en="About the foundation" data-bn="ফাউন্ডেশন সম্পর্কে"></h2>
 <p class="lead" data-en="We work tirelessly to stand beside marginalized communities, the poorest, the helpless and the destitute. Free blood group testing, blood donation programs, health awareness seminars, mother and child healthcare, eye treatment and emergency medical assistance are all part of our initiatives." data-bn="সমাজের প্রান্তিক জনগোষ্ঠী, হতদরিদ্র, অসহায় ও নিঃস্ব মানুষের পাশে দাঁড়াতে আমরা কাজ করে যাচ্ছি নিরলসভাবে। বিনামূল্যে রক্তের গ্রুপ নির্ণয়, রক্তদান কর্মসূচি, স্বাস্থ্য সচেতনতা সেমিনার, মা ও শিশু স্বাস্থ্যসেবা, চক্ষু চিকিৎসা এবং জরুরি চিকিৎসা সহায়তা—সবই আমাদের উদ্যোগের অংশ।"></p>

}

async function resizeImg(file){
 try{ if(!file.type.startsWith("image/")||file.type==="image/gif") return file;
  const bmp=await createImageBitmap(file), k=Math.min(1,1600/Math.max(bmp.width,bmp.height)), cv=document.createElement("canvas");
  cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k); cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
  return (b && b.size<file.size) ? new File([b], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : file;
 }catch(e){ return file; }
}

 const am=el("div","amt"), l=el("div"); l.append(el("small",null,"গৃহীত টাকার পরিমাণ"),el("div","big","৳ "+Number(rc.amount).toLocaleString("bn-BD",{minimumFractionDigits:Number(rc.amount)%1?2:0}))); am.append(l,el("div","w","কথায়: "+bnMoneyWords(rc.amount))); bd.append(tb,am);
 const ft=el("div","ft"), lf=el("div"); lf.style.cssText="display:flex;gap:12px;align-items:flex-end"; const q=el("div"); q.innerHTML=qrSvg(url,96); lf.append(q,el("div","n","এই রসিদটি কম্পিউটারে তৈরি। QR স্ক্যান করে ওয়েবসাইটে যাচাই করা যাবে।"));
 const sg=el("div","s"); sg.appendChild(document.createTextNode(S.cert_signer1_title||"")); if(S.cert_signer1_name){ sg.appendChild(document.createElement("br")); sg.appendChild(document.createTextNode(S.cert_signer1_name)); } ft.append(lf,sg);
 r.append(hd,tt,bd,ft); if(rc.status!=="valid") r.appendChild(el("div","rv","বাতিল")); b.appendChild(r);
 openCm("রসিদ: "+rc.receipt_no); $("cmpr").onclick=()=>{ document.title="Receipt-"+rc.receipt_no; printCm("A4"); };
}
async function loadReceipts(v){
 v.textContent=""; const box=el("div","tw"); v.appendChild(el("p","note","রসিদ দিতে “দান ব্যবস্থাপনা” তে দানের স্ট্যাটাস “verified” করুন, তারপর ওই সারির “রসিদ” বোতামে চাপুন। এখানে দেওয়া সব রসিদের তালিকা।")); v.appendChild(box);
 async function draw(){ box.textContent="লোড হচ্ছে..."; const {data,error}=await db.from("receipts").select("*").order("created_at",{ascending:false}).limit(300); box.textContent="";
  if(error){ box.textContent="ত্রুটি: "+error.message+" (supabase/update-5-receipts.sql চালান)"; return; }
  if(!data.length){ box.appendChild(el("div","empty","এখনো কোনো রসিদ দেওয়া হয়নি।")); return; }
  const t=document.createElement("table"), hr=t.createTHead().insertRow(); ["রসিদ নং","দাতা","টাকা","তারিখ","অবস্থা","",""].forEach(h=>{ const th=document.createElement("th"); th.textContent=h; hr.appendChild(th); }); const tb=t.createTBody();
  data.forEach(c=>{ const tr=tb.insertRow(); [c.receipt_no,c.donor_name,money(c.amount),dateBn(c.received_on),c.status==="valid"?"বৈধ":"বাতিল"].forEach(x=>{ tr.insertCell().textContent=x; });
   const vb=el("button",null,"দেখুন / প্রিন্ট"); vb.type="button"; vb.style.padding="4px 12px"; vb.onclick=()=>showReceipt(c); tr.insertCell().appendChild(vb);
   const rb=el("button","alt",c.status==="valid"?"বাতিল করুন":"আবার চালু করুন"); rb.type="button"; rb.style.padding="4px 12px";
   rb.onclick=async()=>{ if(c.status==="valid"&&!confirm("এই রসিদ বাতিল করবেন? যাচাই-পেজে “বাতিল” দেখাবে।")) return; const {error}=await db.from("receipts").update({status:c.status==="valid"?"cancelled":"valid"}).eq("id",c.id); if(error) return toast("ব্যর্থ: "+error.message,true); toast("সংরক্ষিত হয়েছে"); draw(); }; tr.insertCell().appendChild(rb); });
  box.appendChild(t); }
 draw();
}

function route(){ const a = location.hash === "#admin"; document.body.classList.toggle("adm", a); $("adminView").hidden = !a;
 if(!a) return; window.scrollTo(0,0); show(true);
 if(!db) return lmsg("Supabase সংযুক্ত নেই বা লাইব্রেরি লোড হয়নি।");
 db.auth.getSession().then(({data}) => { if(data.session) enter(data.session.user); }).catch(e => console.error(e)); }
window.addEventListener("hashchange", route); route();
