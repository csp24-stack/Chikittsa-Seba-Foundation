<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chikittsa Seba Foundation | চিকিৎসা সেবা ফাউন্ডেশন</title>
<meta name="description" content="Chikittsa Seba Foundation: medical assistance, blood donation, emergency relief and education support. চিকিৎসা সেবা ফাউন্ডেশন।">
<meta property="og:title" content="Chikittsa Seba Foundation">
<meta property="og:description" content="Serving humanity through medical assistance, blood donation and community development.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f7a4d;--green-d:#14573a;--blue:#1c5d99;--blue-l:#e8f1f9;--mint:#eaf5ef;--ink:#1b2a33;--mute:#56656e;--line:#d9e3e8;--bg:#fff;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a20;--ink:#e6eef2;--mute:#9db0ba;--line:#26373f;--mint:#12251c;--blue-l:#12232f;--green:#4cc38a;--green-d:#3aa874;--blue:#6db3ee}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;font:17px/1.65 "Hind Siliguri",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
#banner{display:none;background:#b42318;color:#fff;text-align:center;padding:8px 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;color:var(--green);text-decoration:none;display:flex;gap:10px;align-items:center}
.brand i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px;line-height:1}
nav{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}nav a{color:var(--ink);text-decoration:none;font-size:15px}nav a:hover{color:var(--green)}
button,.btn{font:inherit;cursor:pointer;border-radius:var(--r);border:2px solid var(--green);background:var(--green);color:#fff;padding:10px 20px;text-decoration:none;display:inline-block;font-weight:500}
.btn.alt{background:transparent;color:var(--green)}.btn.light{background:#fff;color:var(--green-d);border-color:#fff}.btn.ghost{background:transparent;color:#fff;border-color:#fff}
#lang{padding:4px 12px;background:transparent;color:var(--blue);border-color:var(--blue)}
.hero{background:linear-gradient(120deg,rgba(20,87,58,.93),rgba(28,93,153,.88)),url("assets/hero.jpg") center/cover #14573a;color:#fff;padding:90px 0 80px}
.hero h1{font-size:clamp(32px,5.5vw,56px);line-height:1.2;margin:0 0 16px;max-width:15em}.hero p{max-width:36em;font-size:19px;margin:0 0 28px;opacity:.95}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
section{padding:64px 0}section.tint{background:var(--mint)}section.blue{background:var(--blue-l)}
h2{font-size:30px;margin:0 0 8px;line-height:1.25}.sub{color:var(--mute);margin:0 0 32px;max-width:40em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:-40px;background:var(--bg);position:relative}
.stats div{padding:24px;border-right:1px solid var(--line)}.stats b{display:block;font-size:34px;color:var(--green);line-height:1.1}.stats span{color:var(--mute);font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.mv{padding:24px;border-left:5px solid var(--green);background:var(--mint)}.mv.b{border-color:var(--blue);background:var(--blue-l)}.mv h3{margin:0 0 6px}
.progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border-top:1px solid var(--line)}
.progs li{list-style:none;padding:16px 4px;border-bottom:1px solid var(--line);font-weight:500}.progs{padding:0;margin:0}
.progs li small{display:block;color:var(--mute);font-weight:400;font-size:14px}
form{display:grid;gap:14px;max-width:640px}label{display:grid;gap:4px;font-weight:500;font-size:15px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}.chk input{width:auto;margin-top:6px}
.hp{position:absolute;left:-9999px}
.msg{padding:12px 14px;border-radius:8px;display:none}.msg.ok{display:block;background:var(--mint);color:var(--green-d)}.msg.err{display:block;background:#fdecea;color:#8a1c12}
.note{background:var(--blue-l);padding:16px;border-radius:var(--r);max-width:640px}
footer{background:#10241c;color:#cfe3d9;padding:40px 0;font-size:15px}footer a{color:#9fd4ff}
#wa{position:fixed;right:16px;bottom:16px;z-index:6;display:none;background:#25d366;border-color:#25d366;border-radius:50px}
@media(max-width:700px){.bar{padding-bottom:8px}nav{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding-bottom:4px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

[hidden]{display:none!important}body.adm #site{display:none}
#adminView h1{font-size:24px;margin:0;color:var(--green)}
#login{max-width:380px;margin:12vh auto;padding:0 20px;display:grid;gap:12px}
#lmsg{background:#fdecea;color:#8a1c12}
#adminView .ahead{border-bottom:1px solid var(--line)}#adminView .bar .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0}.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.tabs b{background:#d92d20;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}.tw table{border-collapse:collapse;width:100%;font-size:15px}
.tw th,.tw td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tw th{background:var(--mint);white-space:nowrap}.tw tr:last-child td{border-bottom:0}
.tw details summary{cursor:pointer;color:var(--blue);font-weight:500}.tw details dl{margin:8px 0 0;font-size:14px;color:var(--mute);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;max-width:520px}.tw details dt{font-weight:500}.tw details dd{margin:0;word-break:break-word}
.st-pending{border-color:#f79009}.st-approved,.st-verified,.st-fulfilled{border-color:var(--green)}.st-rejected,.st-failed{border-color:#d92d20}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:20px;display:none;z-index:9}
.empty{padding:30px;color:var(--mute)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{background:transparent;color:var(--ink);border-color:var(--line);padding:6px 14px}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.gal figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gal img,.gal video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--mint)}.gal figcaption{padding:10px 12px;font-size:14px;color:var(--mute)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:grid;place-items:center;padding:20px;gap:10px;grid-template-rows:1fr auto;cursor:zoom-out}#lb img{max-width:100%;max-height:80vh;border-radius:8px}#lb p{color:#fff;margin:0}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:14px 0}.gmsg{grid-column:1/-1;color:var(--mute);min-height:1.4em}
.gadm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.gcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.gcard img,.gcard video{width:100%;height:140px;object-fit:cover;display:block}.gcard div{padding:8px 10px;display:grid;gap:6px}
</style>
</head>
<body>
<div id="site">
<div id="banner" role="alert"></div>
<header><div class="wrap bar">
 <a class="brand" href="#top"><i aria-hidden="true">+</i><span data-en="Chikittsa Seba Foundation" data-bn="চিকিৎসা সেবা ফাউন্ডেশন"></span></a>
 <nav aria-label="Main">
  <a href="#about" data-en="About" data-bn="পরিচিতি"></a><a href="#programs" data-en="Programs" data-bn="কার্যক্রম"></a><a href="#gallery" data-en="Gallery" data-bn="গ্যালারি"></a>
  <a href="#donate" data-en="Donate" data-bn="দান"></a><a href="#volunteer" data-en="Volunteer" data-bn="স্বেচ্ছাসেবক"></a>
  <a href="#blood" data-en="Blood" data-bn="রক্ত"></a><a href="#contact" data-en="Contact" data-bn="যোগাযোগ"></a><a href="#admin" data-en="Admin" data-bn="অ্যাডমিন"></a>
  <button id="lang" type="button" aria-label="Switch language">English</button>
 </nav></div></header>

<main id="top">
<div class="hero"><div class="wrap">
 <h1 data-en="Care that reaches those who need it most." data-bn="যাদের প্রয়োজন সবচেয়ে বেশি, সেবা পৌঁছে যাক তাদের কাছেই।"></h1>
 <p data-en="Medical help, blood donation, emergency relief and education support for people in need." data-bn="অসহায় মানুষের জন্য চিকিৎসা সহায়তা, রক্তদান, জরুরি ত্রাণ ও শিক্ষা সহায়তা।"></p>
 <div class="btns"><a class="btn light" href="#donate" data-en="Donate now" data-bn="এখনই দান করুন"></a>
 <a class="btn ghost" href="#volunteer" data-en="Become a volunteer" data-bn="স্বেচ্ছাসেবক হোন"></a>
 <a class="btn ghost" href="#programs" data-en="Our activities" data-bn="আমাদের কার্যক্রম"></a></div>
</div></div>

<div class="wrap"><div class="stats" id="stats">
 <div><b data-stat="stat_volunteers">0</b><span data-en="Volunteers" data-bn="স্বেচ্ছাসেবক"></span></div>
 <div><b data-stat="stat_people_helped">0</b><span data-en="People helped" data-bn="উপকারভোগী"></span></div>
 <div><b data-stat="stat_medical_services">0</b><span data-en="Medical services" data-bn="চিকিৎসা সেবা"></span></div>
 <div><b data-stat="stat_campaigns">0</b><span data-en="Campaigns" data-bn="ক্যাম্পেইন"></span></div>
</div></div>

<section id="about"><div class="wrap">
 <h2 data-en="About the foundation" data-bn="ফাউন্ডেশন সম্পর্কে"></h2>
 <p class="sub" data-en="[Add your official introduction, history and leadership details here.]" data-bn="[এখানে সংগঠনের অফিসিয়াল পরিচিতি, ইতিহাস ও নেতৃত্বের তথ্য যোগ করুন।]"></p>
 <div class="two">
  <div class="mv"><h3 data-en="Mission" data-bn="লক্ষ্য"></h3><p data-en="[Your mission statement]" data-bn="[আপনার লক্ষ্য]"></p></div>
  <div class="mv b"><h3 data-en="Vision" data-bn="ভিশন"></h3><p data-en="[Your vision statement]" data-bn="[আপনার ভিশন]"></p></div>
 </div></div></section>

<section id="programs" class="tint"><div class="wrap">
 <h2 data-en="What we do" data-bn="আমরা যা করি"></h2><p class="sub" data-en="Twelve programs, from the clinic to the community." data-bn="ক্লিনিক থেকে সমাজ পর্যন্ত বারোটি কার্যক্রম।"></p>
 <ul class="progs" id="progs"></ul>
</div></section>

<section id="gallery" class="blue"><div class="wrap">
 <h2 data-en="Photo gallery" data-bn="ফটো গ্যালারি"></h2>
 <p class="sub" data-en="Moments from our medical camps, relief work and community programs." data-bn="আমাদের মেডিকেল ক্যাম্প, ত্রাণ ও কমিউনিটি কার্যক্রমের মুহূর্ত।"></p>
 <div id="chips" class="chips"></div><div id="gal" class="gal"></div>
</div></section>

<section id="donate"><div class="wrap">
 <h2 data-en="Donate" data-bn="দান করুন"></h2>
 <p class="note" data-en="Online payment is not connected yet. Pledges are recorded as pending and verified by our team against the transfer reference you provide. Payment account details: [add bKash / Nagad / Rocket / bank details]." data-bn="অনলাইন পেমেন্ট এখনও সংযুক্ত হয়নি। আপনার দানের অঙ্গীকার 'অপেক্ষমাণ' হিসেবে সংরক্ষিত হবে এবং ট্রান্সফার রেফারেন্স মিলিয়ে আমাদের দল যাচাই করবে। পেমেন্ট অ্যাকাউন্ট: [bKash / Nagad / Rocket / ব্যাংক তথ্য]।"></p><br>
 <form data-table="donations" data-ok="Thank you. Your pledge is recorded and will be verified." data-ok-bn="ধন্যবাদ। আপনার অঙ্গীকার সংরক্ষিত হয়েছে, যাচাই করা হবে।">
  <input class="hp" name="hp_check" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="row"><label><span data-en="Name" data-bn="নাম"></span><input name="donor_name" required maxlength="120"></label>
  <label><span data-en="Amount (BDT)" data-bn="পরিমাণ (টাকা)"></span><input name="amount" type="number" min="1" step="1" required></label></div>
  <div class="row"><label>Email<input name="email" type="email"></label><label><span data-en="Phone" data-bn="ফোন"></span><input name="phone" type="tel"></label></div>
  <div class="row"><label><span data-en="Frequency" data-bn="ধরন"></span><select name="frequency"><option value="one_time">One-time / একবার</option><option value="monthly">Monthly / মাসিক</option></select></label>
  <label><span data-en="Purpose" data-bn="উদ্দেশ্য"></span><select name="purpose"><option>General / সাধারণ</option><option>Medical / চিকিৎসা</option><option>Blood / রক্ত</option><option>Relief / ত্রাণ</option><option>Education / শিক্ষা</option></select></label></div>
  <div class="row"><label><span data-en="Method" data-bn="মাধ্যম"></span><select name="method"><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Bank</option></select></label>
  <label><span data-en="Transaction ID" data-bn="ট্রান্সেকশন আইডি"></span><input name="transaction_ref" maxlength="60"></label></div>
  <button type="button" data-en="Record my pledge" data-bn="অঙ্গীকার জমা দিন"></button><div class="msg" role="status"></div>
 </form></div></section>

<section id="volunteer" class="blue"><div class="wrap">
 <h2 data-en="Volunteer with us" data-bn="আমাদের সাথে স্বেচ্ছাসেবক হোন"></h2><p class="sub" data-en="Applications are reviewed by our administrators." data-bn="আবেদন প্রশাসকগণ পর্যালোচনা করবেন।"></p>
 <form data-table="volunteers" data-ok="Application received. We will contact you after review." data-ok-bn="আবেদন পাওয়া গেছে। পর্যালোচনার পর যোগাযোগ করা হবে।">
  <input class="hp" name="hp_check" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="row"><label><span data-en="Full name" data-bn="পূর্ণ নাম"></span><input name="full_name" required minlength="2" maxlength="120"></label><label>Email<input name="email" type="email" required></label></div>
  <div class="row"><label><span data-en="Mobile" data-bn="মোবাইল"></span><input name="phone" type="tel" required pattern="[0-9+\- ]{8,16}"></label><label><span data-en="Date of birth" data-bn="জন্ম তারিখ"></span><input name="date_of_birth" type="date"></label></div>
  <label><span data-en="Present address" data-bn="বর্তমান ঠিকানা"></span><input name="address"></label>
  <div class="row"><label><span data-en="Profession" data-bn="পেশা"></span><input name="profession"></label>
  <label><span data-en="Department" data-bn="বিভাগ"></span><select name="department"><option>Medical</option><option>Blood donation</option><option>Relief</option><option>Education</option><option>Awareness</option></select></label></div>
  <label><span data-en="Skills and experience" data-bn="দক্ষতা ও অভিজ্ঞতা"></span><textarea name="skills" rows="2"></textarea></label>
  <label><span data-en="Availability" data-bn="সময়"></span><input name="availability"></label>
  <label><span data-en="Why do you want to join?" data-bn="কেন যুক্ত হতে চান?"></span><textarea name="reason" rows="3"></textarea></label>
  <label><span data-en="Emergency contact" data-bn="জরুরি যোগাযোগ"></span><input name="emergency_contact"></label>
  <label class="chk"><input type="checkbox" name="consent" required><span data-en="I agree that the foundation may store and use my information to process this application." data-bn="এই আবেদন প্রক্রিয়ার জন্য ফাউন্ডেশন আমার তথ্য সংরক্ষণ ও ব্যবহার করতে পারে, আমি সম্মত।"></span></label>
  <button type="button" data-en="Submit application" data-bn="আবেদন জমা দিন"></button><div class="msg" role="status"></div>
 </form></div></section>

<section id="blood"><div class="wrap">
 <h2 data-en="Need blood?" data-bn="রক্ত প্রয়োজন?"></h2><p class="sub" data-en="Send an emergency request. Donor phone numbers are never shown publicly; our team connects you." data-bn="জরুরি অনুরোধ পাঠান। ডোনারের ফোন নম্বর প্রকাশ্যে দেখানো হয় না; আমাদের দল যোগাযোগ করিয়ে দেবে।"></p>
 <form data-table="blood_requests" data-ok="Request received. Our team will respond as soon as possible." data-ok-bn="অনুরোধ পাওয়া গেছে। দ্রুত সাড়া দেওয়া হবে।">
  <input class="hp" name="hp_check" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="row"><label><span data-en="Blood group" data-bn="রক্তের গ্রুপ"></span><select name="blood_group" required><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label>
  <label><span data-en="District" data-bn="জেলা"></span><input name="district" required></label></div>
  <div class="row"><label><span data-en="Hospital" data-bn="হাসপাতাল"></span><input name="hospital"></label><label><span data-en="Needed by" data-bn="কবে প্রয়োজন"></span><input name="needed_by" type="date"></label></div>
  <div class="row"><label><span data-en="Your name" data-bn="আপনার নাম"></span><input name="contact_name" required></label><label><span data-en="Your phone" data-bn="আপনার ফোন"></span><input name="contact_phone" type="tel" required></label></div>
  <button type="button" data-en="Send request" data-bn="অনুরোধ পাঠান"></button><div class="msg" role="status"></div>
 </form></div></section>

<section id="contact" class="tint"><div class="wrap">
 <h2 data-en="Contact us" data-bn="যোগাযোগ"></h2>
 <p id="contactInfo" class="sub">Email: [email] · Phone: [phone] · Address: [address]</p>

async function submitForm(form){
 const box = form.querySelector(".msg"); const btn = form.querySelector("button");
 const say = (t,c) => { box.className = "msg " + c; box.textContent = t; };
 if(btn.disabled) return;
 if(!form.reportValidity()) return;
 if(form.elements.hp_check && form.elements.hp_check.value) return;   // honeypot: bots fill this
 if(!db) return say(lang==="bn" ? "Supabase এখনো সংযুক্ত হয়নি (URL/key বসানো হয়নি বা লাইব্রেরি লোড হয়নি)।" : "Supabase is not connected (URL/key missing or library failed to load).", "err");
 const row = {};
 new FormData(form).forEach((v,k) => { if(k!=="hp_check" && v!=="") row[k] = v; });
 form.querySelectorAll("input[type=checkbox]").forEach(c => row[c.name] = c.checked);
 if(row.amount) row.amount = Number(row.amount);
 btn.disabled = true; say(lang==="bn" ? "পাঠানো হচ্ছে..." : "Sending...", "ok");
 let error, timer;
 const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("timeout")), 15000); });
 try { ({error} = await Promise.race([db.from(form.dataset.table).insert(row), timeout])); } catch(e) { error = e; }
 clearTimeout(timer); btn.disabled = false;
 if(error) return say((lang==="bn" ? "জমা হয়নি: " : "Could not submit: ") + (error.message || "network error / timeout"), "err");
 form.reset(); say(lang==="bn" ? form.dataset.okBn : form.dataset.ok, "ok");
}

async function resizeImg(file){
 try{ if(!file.type.startsWith("image/")||file.type==="image/gif") return file;
  const bmp=await createImageBitmap(file), k=Math.min(1,1600/Math.max(bmp.width,bmp.height)), cv=document.createElement("canvas");
  cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k); cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
  return (b && b.size<file.size) ? new File([b], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : file;
 }catch(e){ return file; }
}
